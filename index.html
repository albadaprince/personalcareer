<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Gates — 2026/27 Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1A2B; --slate:#1B2A3F; --slate2:#25374F;
  --paper:#F5F6F4; --paperdim:#E4E7E4;
  --amber:#E8A33D; --teal:#2E8B8B; --rose:#C4553B;
  --muted:#7A8899; --line:#33455E;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--paper);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ---------- masthead ---------- */
header.mast{border-bottom:1px solid var(--line);padding:26px 0 20px}
.mast-in{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{
  font-family:var(--disp); font-weight:700; font-size:clamp(24px,3.4vw,38px);
  letter-spacing:-.02em; margin:0; line-height:1.05;
}
h1 span{color:var(--amber)}
.sub{color:var(--muted);font-size:13px;margin-top:6px;max-width:56ch}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.clock b{display:block;color:var(--paper);font-size:15px;font-weight:500;letter-spacing:.02em}

/* ---------- gate board (signature) ---------- */
.board{padding:22px 0 4px}
.board-lbl{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px
}
.board-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.gate{background:var(--slate);padding:16px 16px 14px;position:relative;min-height:132px;display:flex;flex-direction:column}
.gate.oneshot{background:linear-gradient(180deg,#2A2233 0%,var(--slate) 60%)}
.gate-name{font-family:var(--disp);font-weight:500;font-size:14px;line-height:1.25;margin-bottom:2px}
.gate-when{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.gate-count{margin-top:auto;display:flex;align-items:baseline;gap:7px}
.gate-num{font-family:var(--mono);font-weight:600;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gate-unit{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.gate .tag{
  position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;border-radius:2px
}
.t-amber{color:var(--amber)} .t-rose{color:var(--rose)} .t-teal{color:var(--teal)} .t-mute{color:var(--muted)}
.gate.closed .gate-num,.gate.closed .gate-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;margin:26px 0 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-family:var(--disp);font-size:13.5px;font-weight:500;letter-spacing:.01em;
  padding:11px 15px;cursor:pointer;white-space:nowrap
}
nav.tabs button:hover{color:var(--paper)}
nav.tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--amber)}
nav.tabs .cnt{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0 4px}
input[type=search],select{
  background:var(--slate);border:1px solid var(--line);color:var(--paper);
  font-family:var(--body);font-size:13px;padding:7px 10px;border-radius:3px
}
input[type=search]{min-width:210px}
.spacer{flex:1}
button.act{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 12px;border-radius:3px;cursor:pointer
}
button.act:hover{color:var(--paper);border-color:var(--muted)}
button.act.warn:hover{color:var(--rose);border-color:var(--rose)}

/* ---------- cards ---------- */
.panel{display:none;padding:8px 0 60px}
.panel.on{display:block}
.card{
  background:var(--slate);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:3px;padding:15px 17px;margin-bottom:9px
}
.card.p1{border-left-color:var(--rose)}
.card.p2{border-left-color:var(--amber)}
.card.p3{border-left-color:var(--line)}
.card.done{opacity:.5}
.c-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.c-title{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em;margin:0}
.c-role{color:var(--muted);font-size:13px;margin-top:1px}
.c-meta{display:flex;gap:14px;flex-wrap:wrap;margin:9px 0 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.c-meta b{color:var(--paper);font-weight:500}
.c-body{font-size:13.5px;color:#C9D2DC;margin:10px 0 0}
.c-body strong{color:var(--paper)}
.c-elig{font-size:12.5px;color:var(--muted);margin-top:7px;font-style:italic}
.scores{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.score{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.score i{font-style:normal;color:var(--paper);font-weight:600}
.c-ctl{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.c-ctl select{font-size:12px;padding:5px 8px}
.c-ctl textarea{
  flex:1;min-width:220px;background:var(--ink);border:1px solid var(--line);color:var(--paper);
  font-family:var(--body);font-size:12.5px;padding:6px 9px;border-radius:3px;resize:vertical;min-height:34px
}
.days{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:2px;white-space:nowrap;border:1px solid currentColor}
.d-now{color:var(--rose)} .d-soon{color:var(--amber)} .d-far{color:var(--muted)} .d-past{color:var(--line)}

/* ---------- timeline ---------- */
.tl{border-left:1px solid var(--line);margin-left:8px;padding-left:0}
.tl-item{position:relative;padding:0 0 4px 26px;margin-bottom:14px}
.tl-item::before{
  content:"";position:absolute;left:-4.5px;top:9px;width:8px;height:8px;border-radius:50%;
  background:var(--slate);border:1.5px solid var(--muted)
}
.tl-item.now::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px rgba(232,163,61,.16)}
.tl-item.past::before{background:var(--line);border-color:var(--line)}
.tl-mo{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.tl-item.now .tl-mo{color:var(--amber)}
.tl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:7px}
.tl-cell{background:var(--slate);padding:11px 12px}
.tl-k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.tl-v{font-size:12.5px;color:#C9D2DC;line-height:1.5}

/* ---------- table-ish rows ---------- */
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--line)
}
.rt td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:#C9D2DC}
.rt td:first-child{color:var(--paper);font-weight:500;font-family:var(--disp)}
.rt tr.good td{background:rgba(46,139,139,.08)}
.rt tr.bad td{background:rgba(196,85,59,.09)}

.note{
  background:var(--slate2);border:1px solid var(--line);border-radius:3px;
  padding:13px 15px;font-size:13px;color:#C9D2DC;margin:0 0 18px
}
.note b{color:var(--amber);font-family:var(--disp)}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--amber);color:var(--ink);
  font-family:var(--mono);font-size:12px;padding:9px 18px;border-radius:3px;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:50;font-weight:500
}
.toast.on{opacity:1}

@media(max-width:900px){
  .gates{grid-template-columns:repeat(2,1fr)}
  .tl-grid{grid-template-columns:1fr}
  .rt{display:block;overflow-x:auto;white-space:normal}
}
@media(max-width:560px){
  .gates{grid-template-columns:1fr}
  .clock{text-align:left}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="mast"><div class="wrap"><div class="mast-in">
  <div>
    <h1>Career <span>Gates</span></h1>
    <div class="sub">Post-GSID campaign, Aug 2026 → Dec 2027. Every date must be re-verified at the source before you act on it.</div>
  </div>

</div></div></header>

      <option value="2">Priority 2</option><option value="3">Priority 3</option>
    </select>
    <select id="fst" aria-label="Filter status"><option value="">All statuses</option></select>
    <span class="spacer"></span>
    <button class="act" id="exp">Export backup</button>
    <button class="act" id="impBtn">Import</button>
    <input type="file" id="imp" accept="application/json" hidden>
    <button class="act warn" id="rst">Reset</button>
  </div>

  <div class="panel on" id="p-opps"></div>
  <div class="panel" id="p-time"></div>
  <div class="panel" id="p-gaps"></div>
  <div class="panel" id="p-phd"></div>
  <div class="panel" id="p-net"></div>

</div>

<footer><div class="wrap">
  Saved in this browser only (localStorage). Export a backup before clearing site data or switching machines.
</div></footer>
<div class="toast" id="toast"></div>

const OPP_ST=["Not started","Preparing","Submitted","Interview","Offer","Rejected","Passed"];
const NET_ST=["Not contacted","Emailed","Replied","Call booked","Ongoing","Cold"];
const GAP_ST=["Open","In progress","Closed"];

/* ============================ STATE ============================ */
const KEY="careergates.v1";
let S={opps:{},net:{},gaps:{}};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Could not save — storage blocked");}}
function oppSt(id){return (S.opps[id]&&S.opps[id].st)||"Not started"}
function oppNote(id){return (S.opps[id]&&S.opps[id].note)||""}
function setOpp(id,k,v){S.opps[id]=S.opps[id]||{};S.opps[id][k]=v;save()}
function netSt(id){return S.net[id]||"Not contacted"}
function gapSt(n){return S.gaps[n]|| GAPS.find(g=>g.n===n).st}

const TODAY=new Date(); TODAY.setHours(0,0,0,0);
function days(d){return Math.round((new Date(d+"T00:00:00")-TODAY)/864e5)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1900)}

document.getElementById("today").textContent=TODAY.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

/* ============================ GATE BOARD ============================ */
function renderGates(){
  const ids=["wbypp","imfrap","aiib","bipcpm"];
  document.getElementById("gates").innerHTML=ids.map(id=>{
    const o=OPPS.find(x=>x.id===id), d=days(o.date), past=d<0;
    const tone = past?"t-mute": d<60?"t-rose": d<180?"t-amber":"t-teal";
    const tag  = o.oneshot?"one shot": past?"closed": d<60?"urgent":"open";
    return `<div class="gate ${o.oneshot?"oneshot":""} ${past?"closed":""}">
      <span class="tag ${o.oneshot?"t-rose":tone}">${tag}</span>
      <div class="gate-name">${esc(o.inst)}</div>
      <div class="gate-when">${esc(o.win)}</div>
      <div class="gate-count">
        <span class="gate-num ${tone}">${past?"—":d}</span>
        <span class="gate-unit">${past?"window passed":"days"}</span>
      </div></div>`;
  }).join("");
}

/* ============================ TABS ============================ */
const TABS=[["opps","Opportunities",OPPS.length],["time","Timeline",TIME.length],
            ["gaps","Profile gaps",GAPS.length],["phd","PhD routes",PHD.length],["net","Network",NET.length]];
document.getElementById("tabs").innerHTML=TABS.map(([k,l,n],i)=>
  `<button role="tab" data-t="${k}" aria-selected="${i===0}">${l}<span class="cnt">${n}</span></button>`).join("");
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-t]"); if(!b) return;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.t));
  document.getElementById("tools").style.display = (b.dataset.t==="opps"||b.dataset.t==="net")?"flex":"none";
});

const fst=document.getElementById("fst");
OPP_ST.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;fst.appendChild(o)});

/* ============================ PANELS ============================ */
function renderOpps(){
  const q=document.getElementById("q").value.toLowerCase();
  const fp=document.getElementById("fpri").value, fs=fst.value;
  const html=OPPS.filter(o=>{
    if(fp && String(o.pri)!==fp) return false;
    if(fs && oppSt(o.id)!==fs) return false;
    if(q && !(o.inst+o.role+o.loc+o.cat+o.prep+oppNote(o.id)).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>a.pri-b.pri||days(a.date)-days(b.date)).map(o=>{
    const d=days(o.date), st=oppSt(o.id);
    const cls = d<0?"d-past": d<60?"d-now": d<200?"d-soon":"d-far";
    const done=["Rejected","Passed","Offer"].includes(st);
    return `<article class="card p${o.pri} ${done?"done":""}">
      <div class="c-top">
        <div><h3 class="c-title">${esc(o.inst)}</h3><div class="c-role">${esc(o.role)}</div></div>
        <span class="days ${cls}">${d<0?"window passed":d+" days"}</span>
      </div>
      <div class="c-meta"><span>${esc(o.loc)}</span><span>${esc(o.cat)}</span><span>Window <b>${esc(o.win)}</b></span><span>Verify at <b>${esc(o.src)}</b></span></div>
      <div class="c-elig">${esc(o.elig)}</div>
      <div class="c-body">${o.prep}</div>
      <div class="scores">
        <span class="score">pay <i>${o.pay}</i></span><span class="score">prestige <i>${o.pres}</i></span>
        <span class="score">research fit <i>${o.fit}</i></span><span class="score">phd value <i>${o.phd}</i></span>
      </div>
      <div class="c-ctl">
        <select data-opp="${o.id}">${OPP_ST.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select>
        <textarea data-note="${o.id}" placeholder="Notes, contact names, submission date…">${esc(oppNote(o.id))}</textarea>
      </div></article>`;
  }).join("");
  document.getElementById("p-opps").innerHTML =
    `<div class="note"><b>Reminder.</b> Scores are 1–5 against your own stated priorities, not objective rankings. Every date needs re-verifying at the source — institutions move their cycles.</div>`+
    (html||`<div class="note">Nothing matches those filters.</div>`);
}

function renderTime(){
  const nowKey=TODAY.toISOString().slice(0,7);
  document.getElementById("p-time").innerHTML=`<div class="tl">`+TIME.map(t=>{
    const state = t.k<nowKey?"past": t.k.slice(0,7)===nowKey?"now":"";
    return `<div class="tl-item ${state}">
      <div class="tl-mo">${esc(t.m)}${state==="now"?" · you are here":""}</div>
      <div class="tl-grid">
        <div class="tl-cell"><div class="tl-k">Applications</div><div class="tl-v">${esc(t.a)}</div></div>
        <div class="tl-cell"><div class="tl-k">Profile building</div><div class="tl-v">${esc(t.b)}</div></div>
        <div class="tl-cell"><div class="tl-k">Networking</div><div class="tl-v">${esc(t.c)}</div></div>
        <div class="tl-cell"><div class="tl-k">Admin</div><div class="tl-v">${esc(t.d)}</div></div>
      </div></div>`;
  }).join("")+`</div>`;
}

function renderGaps(){
  document.getElementById("p-gaps").innerHTML=
   `<div class="note"><b>Read gap 1 first.</b> It is the single item blocking you at both the IMF and every economics PhD committee, and it is the slowest to fix.</div>`+
   GAPS.map(g=>{
    const st=gapSt(g.n), closed=st==="Closed";
    return `<article class="card ${g.n<=3?"p1":"p3"} ${closed?"done":""}">
      <div class="c-top"><div><h3 class="c-title">${g.n}. ${esc(g.g)}</h3></div>
      <span class="days ${closed?"d-past":"d-soon"}">${esc(g.by)}</span></div>
      <div class="c-body"><strong>Why it costs you.</strong> ${esc(g.w)}</div>
      <div class="c-body"><strong>The fix.</strong> ${esc(g.f)}</div>
      <div class="c-ctl"><select data-gap="${g.n}">${GAP_ST.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></div>
    </article>`;
  }).join("");
}

function renderPhd(){
  document.getElementById("p-phd").innerHTML=
   `<div class="note"><b>The decisive variable is permit type, not country.</b> In the Netherlands the same degree gives your wife opposite outcomes depending on whether you are employed or on a study permit. Get it confirmed in writing by the university's HR before accepting anything.</div>
    <table class="rt"><thead><tr><th style="width:15%">Route</th><th style="width:20%">What you receive</th><th style="width:24%">Spouse work rights</th><th style="width:11%">Timing</th><th style="width:11%">Obligation</th><th style="width:19%">Risk</th></tr></thead><tbody>`+
   PHD.map(p=>`<tr class="${p.tone}"><td>${esc(p.r)}<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.08em">${esc(p.v)}</div></td>
     <td>${esc(p.get)}</td><td>${p.sp}</td><td>${esc(p.t)}</td><td>${esc(p.o)}</td><td>${p.risk}</td></tr>`).join("")+
   `</tbody></table>`;
}

function renderNet(){
  const q=document.getElementById("q").value.toLowerCase();
  const fp=document.getElementById("fpri").value;
  const html=NET.filter(n=>{
    if(fp && String(n.pri)!==fp) return false;
    if(q && !(n.name+n.now+n.why+n.prog).toLowerCase().includes(q)) return false;
    return true;
  }).map(n=>{
    const st=netSt(n.id);
    return `<article class="card p${n.pri} ${st==="Cold"?"done":""}">
      <div class="c-top"><div><h3 class="c-title">${esc(n.name)}</h3><div class="c-role">${esc(n.now)}</div></div>
      <span class="days d-far">${esc(n.prog)}</span></div>
      <div class="c-body">${esc(n.why)}</div>
      <div class="c-meta"><span>Route in <b>${esc(n.route)}</b></span></div>
      <div class="c-ctl"><select data-net="${n.id}">${NET_ST.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></div>
    </article>`;
  }).join("");
  document.getElementById("p-net").innerHTML =
    `<div class="note"><b>The directories are from 2025.</b> Verify anyone's current role before you write to them — half these records were already stale when the list was published.</div>`+
    (html||`<div class="note">Nothing matches those filters.</div>`);
}

/* ============================ EVENTS ============================ */
document.body.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.opp){setOpp(t.dataset.opp,"st",t.value);renderOpps();toast("Status saved")}
  if(t.dataset.net){S.net[t.dataset.net]=t.value;save();renderNet();toast("Status saved")}
  if(t.dataset.gap){S.gaps[t.dataset.gap]=t.value;save();renderGaps();toast("Status saved")}
});
document.body.addEventListener("input",e=>{
  if(e.target.dataset.note){clearTimeout(window._n);window._n=setTimeout(()=>{setOpp(e.target.dataset.note,"note",e.target.value);toast("Note saved")},600)}
});
["q","fpri","fst"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{renderOpps();renderNet()}));

document.getElementById("exp").onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="career-gates-backup-"+TODAY.toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href); toast("Backup downloaded");
};
document.getElementById("impBtn").onclick=()=>document.getElementById("imp").click();
document.getElementById("imp").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{S=Object.assign({opps:{},net:{},gaps:{}},JSON.parse(r.result));save();renderAll();toast("Backup restored")}
               catch(err){toast("That file could not be read")}};
  r.readAsText(f);
};
document.getElementById("rst").onclick=()=>{
  if(confirm("Clear every status and note? Export a backup first if you want to keep them.")){
    S={opps:{},net:{},gaps:{}};save();renderAll();toast("Cleared");}
};

function renderAll(){renderGates();renderOpps();renderTime();renderGaps();renderPhd();renderNet()}
renderAll();
</script>
